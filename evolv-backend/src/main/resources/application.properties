spring.application.name=evolv-backend
server.port=8080

# Banco H2 em memoria - zero configuracao, ideal para desenvolvimento e demonstracao.
# Para trocar por PostgreSQL depois, basta substituir estas 4 linhas pelas
# credenciais do Postgres e adicionar a dependencia do driver no pom.xml.
spring.datasource.url=jdbc:h2:mem:evolvdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mantem a sessao do Hibernate aberta durante a serializacao da resposta,
# para que os relacionamentos LAZY (categoria, questoes, alternativas)
# sejam carregados corretamente ao montar o JSON.
spring.jpa.open-in-view=true

# Console H2 para inspecionar os dados em http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:evolvdb | usuario: sa | senha: (em branco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JWT (login e controle de acesso) ----
# Chave usada para assinar os tokens. Em producao isso deve vir de uma
# variavel de ambiente/secret manager, nunca ficar hardcoded no repositorio -
# mas para o projeto academico, com prazo curto, mantemos aqui.
evolv.jwt.secret=troque-esta-chave-por-uma-bem-longa-e-secreta-para-producao-evolv-2026
# Tempo de expiracao do token: 24 horas (em milissegundos)
evolv.jwt.expiracao-ms=86400000
